<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PARDES Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">🌳</span>
      <div>
        <h1 data-i18n="app.title">PARDES Play</h1>
        <p class="tagline" data-i18n="app.tagline">Learn Torah through play</p>
      </div>
    </div>
    <div class="lang-controls">
      <label>
        <span data-i18n="settings.uiLanguage">Interface</span>
        <select id="ui-lang">
          <option value="en">English</option>
          <option value="he">עברית</option>
        </select>
      </label>
      <label>
        <span data-i18n="settings.textLanguage">Study text</span>
        <select id="text-lang">
          <option value="en">English</option>
          <option value="he">עברית</option>
          <option value="both">Both</option>
        </select>
      </label>
    </div>
  </header>

  <main class="container">
    <section class="card intro">
      <h2 data-i18n="home.pardesTitle">PaRDeS</h2>
      <p data-i18n="home.pardesDesc">Four gates of Torah — each stream is a different path of learning.</p>
    </section>
    <h2 class="section-title" data-i18n="home.chooseStream">Choose a stream</h2>
    <div id="stream-grid" class="stream-grid"></div>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer.disclaimer">Educational only — not psak halacha.</p>
    <p><a href="https://www.sefaria.org" target="_blank" rel="noopener">Sefaria</a></p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
